name: Rekap Iklan Harian ke Telegram

on:
  schedule:
    # Jalan otomatis setiap jam 16:15 WIB (09:15 UTC)
    - cron: '15 9 * * *'
  # Memungkinkan dijalankan secara manual kapan saja dari tab Actions
  workflow_dispatch:
  # Memungkinkan dipicu secara presisi oleh cron/webhook eksternal (misal cron-job.org)
  repository_dispatch:
    types: [daily_recap]

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Batas maksimal 5 menit agar tidak pernah menggantung

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Jalankan Scraper & Kirim Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper_recap.py
